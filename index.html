<script>
var bgmA=document.getElementById('bgm');var bgmStopped=false;
function bgmPlay(){if(bgmStopped)return;var p=bgmA.play();if(p!==undefined){p.catch(function(){});}}
bgmPlay();
document.addEventListener('pointerdown',function bgmFirst(){bgmPlay();document.removeEventListener('pointerdown',bgmFirst);});
document.getElementById('bgmStop').addEventListener('click',function(){bgmStopped=true;bgmA.pause();bgmA.currentTime=0;});
